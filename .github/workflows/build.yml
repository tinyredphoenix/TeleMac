name: Build TeleMac macOS App

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build TeleMac
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout TeleMac repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode Developer Directory
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install Build Tools via Homebrew
        run: |
          brew install cmake ninja meson nasm yasm zlib autoconf libtool automake pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure and Build Native Frameworks
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export DEVELOPER_DIR=$(xcode-select -p)
          
          # Patch tg_owt abseil lifetimebound if present
          ABSL_ATTR="submodules/tg_owt/src/third_party/abseil-cpp/absl/base/attributes.h"
          if [ -f "$ABSL_ATTR" ]; then
            sed -i '' -e 's|^#define ABSL_ATTRIBUTE_LIFETIME_BOUND \[\[clang::lifetimebound\]\]|#define ABSL_ATTRIBUTE_LIFETIME_BOUND|' "$ABSL_ATTR" 2>/dev/null || true
            sed -i '' -e 's|^#define ABSL_ATTRIBUTE_LIFETIME_BOUND __attribute__((lifetimebound))|#define ABSL_ATTRIBUTE_LIFETIME_BOUND|' "$ABSL_ATTR" 2>/dev/null || true
          fi
          
          sh scripts/configure_frameworks.sh

      - name: Build TeleMac Xcode Workspace
        run: |
          xcodebuild -workspace Telegram-Mac.xcworkspace \
            -scheme Telegram \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -destination 'platform=macOS' \
            -jobs $(sysctl -n hw.ncpu) \
            build

      - name: Package TeleMac.app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release -name "Telegram.app" -o -name "TeleMac.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" | grep -v "Helper" | head -1)
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p dist
          cp -R "$APP_PATH" dist/TeleMac.app
          cd dist
          zip -r -y TeleMac-macOS.zip TeleMac.app
          cd ..
          ls -lh dist/TeleMac-macOS.zip

      - name: Upload TeleMac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleMac-macOS-arm64
          path: dist/TeleMac-macOS.zip
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "TeleMac ${{ github.ref_name || 'v1.0.0' }}"
          files: dist/TeleMac-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
